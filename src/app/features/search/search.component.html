<div class="max-w-6xl mx-auto p-4">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Search Places</h1>

    <form (ngSubmit)="search()" class="bg-white rounded-lg shadow-md p-6 mb-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Keyword</label>
            <input type="text" [(ngModel)]="query" name="query" placeholder="e.g. pizza, museum"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Latitude</label>
            <input type="number" step="any" [(ngModel)]="lat" name="lat" placeholder="40.7128"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Longitude</label>
            <input type="number" step="any" [(ngModel)]="lng" name="lng" placeholder="-74.0060"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>
        <div class="mt-4 flex justify-end">
            <button type="submit" [disabled]="loading || !query || !lat || !lng"
                    class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed">
            {{ loading ? 'Searching...' : 'Search' }}
            </button>
        </div>
    </form>

    <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md mb-6">
    {{ error }}
    </div>

    <div *ngIf="results.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div *ngFor="let place of results" class="bg-white rounded-lg shadow-md p-4 flex flex-col">
            <h3 class="text-lg font-semibold text-gray-800 mb-2">{{ place.name }}</h3>
            <p class="text-gray-600 text-sm mb-1">{{ place.address }}</p>
            <div class="text-sm text-gray-500 mb-2">
            <span *ngFor="let cat of place.categories" class="inline-block bg-gray-100 rounded px-2 py-0.5 mr-1 mb-1">
                {{ cat }}
            </span>
            </div>
            <div class="text-sm text-gray-500 mb-3">
            <span *ngIf="place.rating">Rating: {{ place.rating }}/10</span>
            <span *ngIf="place.geolocation" class="ml-2">
                {{ place.geolocation.lat | number:'1.4' }}, {{ place.geolocation.lng | number:'1.4' }}
            </span>
            </div>
            <div class="mt-auto flex gap-2">
            <a [routerLink]="['/place', place.id]" class="px-3 py-1.5 bg-green-600 text-white text-sm rounded hover:bg-green-700">
                View Details
            </a>
            <button (click)="toggleWishlist(place)"
                    [class.bg-red-500]="wishListService.isInWishlist(place.id)"
                    [class.bg-gray-500]="!wishListService.isInWishlist(place.id)"
                    class="px-3 py-1.5 text-white text-sm rounded hover:opacity-90">
                {{ wishListService.isInWishlist(place.id) ? 'Remove' : 'Wishlist' }}
            </button>
            </div>
        </div>
    </div>

    <div *ngIf="results.length === 0 && !loading && !error" class="text-center text-gray-500 py-12">
    Enter a keyword and coordinates to places.
    </div>
</div>
