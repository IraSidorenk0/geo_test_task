<div class="max-w-6xl mx-auto p-4">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">My Wishlist</h1>

    <div *ngIf="wishListService.getWishlist().length === 0" class="text-center text-gray-500 py-12">
    You have no saved places.
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div *ngFor="let place of wishListService.getWishlist()" class="bg-white rounded-lg shadow-md p-4 flex flex-col">
        <h3 class="text-lg font-semibold text-gray-800 mb-2">{{ place.name }}</h3>
        <p class="text-gray-600 text-sm mb-1">{{ place.address }}</p>
        <div class="text-sm text-gray-500 mb-2">
        <span *ngFor="let cat of place.categories" class="inline-block bg-gray-100 rounded px-2 py-0.5 mr-1 mb-1">
            {{ cat }}
        </span>
        </div>
        <div class="text-sm text-gray-500 mb-3">
        <span *ngIf="place.rating">Rating: {{ place.rating }}/10</span>
        <span *ngIf="place.geolocation" class="ml-2">
            {{ place.geolocation.lat | number:'1.4' }}, {{ place.geolocation.lng | number:'1.4' }}
        </span>
        </div>
        <div class="mt-auto flex gap-2">
        <a [routerLink]="['/place', place.id]" class="px-3 py-1.5 bg-green-600 text-white text-sm rounded hover:bg-green-700">
            View Details
        </a>
        <button (click)="wishListService.removeFromWishlist(place.id)"
                class="px-3 py-1.5 bg-red-600 text-white text-sm rounded hover:bg-red-700">
            Remove
        </button>
        </div>
    </div>
    </div>

    <div *ngIf="wishListService.getWishlist().length > 0" class="mt-6 text-center">
    <button (click)="wishListService.clearWishlist()" class="px-4 py-2 bg-gray-800 text-white rounded hover:bg-gray-900">
        Clear All
    </button>
    </div>
</div>
