<div class="max-w-3xl mx-auto p-4 details-bg mt-5" *ngIf="place; else loading">   

    <div class=" shadow-md p-6 ">
        <a routerLink="/" class="inline-block hover:underline mb-4">&larr; Back to Search</a>
        <h1 class="text-2xl font-bold text-white mb-2">{{ place.name }}</h1>
        <p class="text-gray-200 mb-4">{{ place.address }}</p>

        <div class="mb-4">
            <span *ngFor="let cat of place.categories" class="inline-block bg-blue-100 text-blue-800 text-xs font-semibold mr-2 mb-2 px-2.5 py-0.5 ">
            {{ cat }}
            </span>
        </div>

        <div *ngIf="place.rating" class="mb-4">
            <span class="text-yellow-500">&#9733;</span>
            <span class="text-gray-100 font-medium">{{ place.rating }}/10</span>
        </div>

        <div class="text-sm text-gray-200 mb-4">
            <span *ngIf="place.geolocation">
            Geolocation: {{ place.geolocation.lat | number:'1.6' }}, {{ place.geolocation.lng | number:'1.6' }}
            </span>
        </div>

        <div *ngIf="safePhotos && safePhotos.length" class="mb-4">
            <h3 class="text-lg font-semibold mb-2">Photos</h3>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
                <img *ngFor="let photo of safePhotos" [src]="photo" alt="Place photo" class=" w-full h-32 object-cover">
            </div>
        </div>

        <div *ngIf="place.reviews && place.reviews.length" class="mb-4">
            <h3 class="text-lg font-semibold mb-2">Reviews</h3>
            <ul class="space-y-2">
            <li *ngFor="let review of place.reviews" class="bg-gray-50 p-3  text-gray-100 text-sm">
                {{ review }}
            </li>
            </ul>
        </div>

        <div class="mt-6 flex gap-3">
            <button (click)="toggleWishlist(place)"
                    [class.bg-red-600]="wishListService.isInWishlist(place.id)"
                    [class.bg-gray-600]="!wishListService.isInWishlist(place.id)"
                    class="px-4 py-2 text-white hover:opacity-90">
            {{ wishListService.isInWishlist(place.id) ? 'Remove from Wishlist' : 'Add to Wishlist' }}
            </button>
        </div>
    </div>
</div>

<ng-template #loading>
    <div class="text-center text-gray-200 py-12">Loading...</div>
</ng-template>
